name: 機能追加
description: 新しい機能の提案
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 追加したい機能の概要
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 背景・モチベーション
      description: なぜこの機能が必要か
    validations:
      required: true
  - type: textarea
    id: desired-behavior
    attributes:
      label: 実現したいこと
      description: 具体的な動作イメージ
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した別のアプローチ
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: 補足情報
      description: スクリーンショット等
    validations:
      required: false
